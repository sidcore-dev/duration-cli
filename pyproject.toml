[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duration-cli"
version = "1.0.0"
description = "Convert between human-readable durations (2h30m) and total seconds, auto-detecting direction."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["duration", "time", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
duration-cli = "duration_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
